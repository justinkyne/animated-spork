<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYRISE — Tower Sim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-group" id="hud-funds-box">
        <div class="hud-label">FUNDS</div>
        <div id="hud-money">$750,000</div>
        <div id="hud-flow" class="hud-sub"></div>
      </div>

      <div class="hud-group" id="hud-clock-box">
        <div id="hud-clock">7:00 AM</div>
        <div id="hud-date" class="hud-sub">MON · Day 1 · Year 1 · Spring</div>
        <div id="hud-speed">
          <button class="spd-btn" data-speed="0" title="Pause (Space)">⏸</button>
          <button class="spd-btn active" data-speed="1" title="Normal speed">▶</button>
          <button class="spd-btn" data-speed="2" title="2× speed">2×</button>
          <button class="spd-btn" data-speed="3" title="4× speed">4×</button>
          <button class="spd-btn" data-speed="4" title="8× speed">8×</button>
        </div>
      </div>

      <div class="hud-group" id="hud-rating-box">
        <div id="hud-stars">★<span class="dim">★★★★</span></div>
        <div id="hud-pop" class="hud-sub">Population 0</div>
        <div id="star-progress"><div id="star-progress-fill"></div></div>
        <div id="star-progress-label" class="hud-sub"></div>
      </div>
    </header>

    <div id="main">
      <nav id="sidebar">
        <div id="tools"></div>
        <div id="sidebar-footer">
          <button class="sys-btn" id="btn-help" title="Help &amp; controls">?</button>
          <button class="sys-btn" id="btn-sound" title="Toggle sound">🔊</button>
          <button class="sys-btn" id="btn-save" title="Save game">💾</button>
          <button class="sys-btn" id="btn-new" title="New game">🗑</button>
        </div>
      </nav>

      <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>

      <aside id="rightpanel">
        <div id="tabs">
          <button class="tab-btn active" data-tab="goals">Goals</button>
          <button class="tab-btn" data-tab="info">Info</button>
          <button class="tab-btn" data-tab="stats">Stats</button>
        </div>
        <div id="tab-goals" class="tab"></div>
        <div id="tab-info" class="tab hidden"><div class="muted">Click anything in the tower to inspect it.</div></div>
        <div id="tab-stats" class="tab hidden"></div>
      </aside>
    </div>

    <footer id="statusbar">
      <span id="status-text">Welcome to Skyrise! Pick a tool on the left and start building.</span>
      <span id="cursor-pos"></span>
    </footer>

    <div id="toasts"></div>
    <div id="modal" class="hidden"><div id="modal-card"></div></div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/time.js"></script>
  <script src="js/room.js"></script>
  <script src="js/elevator.js"></script>
  <script src="js/person.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/save.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
